# The only automatic route by which a production tag comes about.
name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Per the non-negotiable rule the app credentials live exclusively in this
    # environment. Without the declaration they are invisible to the job.
    environment: release
    steps:
      # The release pull request MUST be created with an app token. GitHub
      # suppresses workflow triggers from GITHUB_TOKEN pushes as recursion
      # protection; CI would then never run on the release pull request and the
      # required check would stay pending. An app token is a genuine actor.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # No lockfile synchronisation step. The kernel version is not stored in a
      # file at all: Kernel.mk derives it from `git describe --tags`, so the tag
      # release-please creates is the single source of truth.

      # release.yml deliberately has NO tag trigger. This is the only automatic
      # starting point; otherwise two pipelines would run on every tag creation.
      - name: Start the release build for the new draft
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
