name: Release

# NO tag trigger. release-please creates the tag and starts this pipeline with
# `gh workflow run release.yml --ref "$TAG"`. A tag trigger here would run a
# second pipeline in parallel on every tag creation, and it would also fire for
# any of the 31 inherited upstream tags that a stray `git push --tags` pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  toolchain-version: 14.3.rel1
  boot-home: external/circle-stdlib/libs/circle/boot
  wlan-home: external/circle-stdlib/libs/circle/addon/wlan

jobs:
  identity:
    name: Establish identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: The ref must be a release tag on this very commit
        id: check
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::this pipeline runs on a release tag only, got $GITHUB_REF_TYPE $tag"
            exit 1
          fi

          # Canonical SemVer with a leading v. A prerelease suffix is allowed;
          # build metadata is not, because it would reach artefact file names.
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $tag is not canonical SemVer with a leading v"
            exit 1
          fi

          # The tag must point at the commit this run was started from.
          if [ "$(git rev-parse "${tag}^{}")" != "$GITHUB_SHA" ]; then
            echo "::error::tag $tag does not point at $GITHUB_SHA"
            exit 1
          fi

          # The release core, so without any prerelease suffix, is what the
          # manifest and every artefact name carry.
          version="${tag#v}"
          version="${version%%-*}"

          manifest=$(jq -r '."."' .release-please-manifest.json)
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag core $version does not match the manifest version $manifest"
            exit 1
          fi

          # For a production tag the draft release-please created must already
          # exist. Filling a release that is not there would silently create a
          # second one. A deliberately planned test tag has no release-please
          # draft by definition, so the packaging job creates it instead; that
          # job holds contents: write, this one does not.
          case "$tag" in
            *-*)
              echo "::notice::$tag is a test tag; its draft is created during packaging"
              ;;
            *)
              if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
                echo "::error::there is no draft release for $tag"
                exit 1
              fi
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $tag as version $version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: identity
    runs-on: ubuntu-latest
    name: build-${{ matrix.board }}
    strategy:
      fail-fast: false
      matrix:
        board: [pi3-64, pi4-64, pi5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch submodules
        run: make submodules

      - name: Cache ARM toolchains
        id: cache-toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
          key: cache-arm-toolchains-${{ env.toolchain-version }}

      - name: Install toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          for triplet in arm-none-eabi aarch64-none-elf; do
            wget -q https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.toolchain-version }}/binrel/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
            tar -xf arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz -C ~
            rm arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
          done

      - name: Update PATH
        run: |
          for triplet in arm-none-eabi aarch64-none-elf; do
            echo "$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> "$GITHUB_PATH"
          done

      - name: Build
        run: make -j BOARD=${{ matrix.board }}

      - name: Upload kernel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-${{ matrix.board }}
          path: kernel*.img

  package:
    needs: [identity, build]
    runs-on: ubuntu-latest
    # The environment restricts deployments to main and v* tags and is where
    # any publication credential would live.
    environment: release
    permissions:
      # Filling and publishing the release.
      contents: write
      # Cosign keyless signing and attest-build-provenance both mint an OIDC
      # token; the attestation is written to the repository's attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch submodules
        run: make submodules

      - name: Cache ARM toolchains
        id: cache-toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
          key: cache-arm-toolchains-${{ env.toolchain-version }}

      - name: Update PATH
        run: |
          for triplet in arm-none-eabi aarch64-none-elf; do
            echo "$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> "$GITHUB_PATH"
          done

      - name: Download boot firmware
        run: |
          make -C ${{ env.boot-home }} firmware armstub64
          cp ${{ env.boot-home }}/armstub8-rpi4.bin \
             ${{ env.boot-home }}/bcm2711-rpi-4-b.dtb \
             ${{ env.boot-home }}/bcm2711-rpi-400.dtb \
             ${{ env.boot-home }}/bcm2711-rpi-cm4.dtb \
             ${{ env.boot-home }}/bootcode.bin \
             ${{ env.boot-home }}/COPYING.linux \
             ${{ env.boot-home }}/fixup_cd.dat \
             ${{ env.boot-home }}/fixup4cd.dat \
             ${{ env.boot-home }}/LICENCE.broadcom \
             ${{ env.boot-home }}/start_cd.elf \
             ${{ env.boot-home }}/start4cd.elf \
             sdcard

      - name: Download WLAN firmware
        run: |
          mkdir -p sdcard/firmware
          make -C ${{ env.wlan-home }}/firmware
          cp ${{ env.wlan-home }}/firmware/*.bin \
             ${{ env.wlan-home }}/firmware/*.txt \
             ${{ env.wlan-home }}/firmware/*.clm_blob \
             sdcard/firmware/
          wget -q -O sdcard/firmware/LICENCE.broadcom_bcm43xx \
               https://raw.githubusercontent.com/RPi-Distro/firmware-nonfree/master/debian/config/brcm80211/LICENSE

      # Pinned to a commit and checked against recorded hashes. The previous
      # source was an unpinned Google Drive link fetched with gdown, so whatever
      # sat behind that link went into the release unverified.
      - name: Download the GeneralUser GS SoundFont
        env:
          # GeneralUser GS 2.0.3, documentation revision 6.
          GUGS_COMMIT: 684543d5e5efaef08d02be50dcda8d552478fa60
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/${GUGS_COMMIT}"
          curl -sSfL -o GeneralUser-GS.sf2      "${base}/GeneralUser-GS.sf2"
          curl -sSfL -o CHANGELOG.GeneralUserGS "${base}/documentation/CHANGELOG.md"
          curl -sSfL -o LICENSE.GeneralUserGS   "${base}/documentation/LICENSE.txt"

          printf '%s  %s\n' \
            9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe GeneralUser-GS.sf2 \
            2ed3138c31d43c8a36e106703679e3ec88bf579da7c34051bd9531ec08939b44 CHANGELOG.GeneralUserGS \
            7b32efefdf95ce38a043799f0659853ddc00fbaa14d8c50f0aca16b9b8b405be LICENSE.GeneralUserGS \
            > gugs.sha256
          sha256sum --check --strict gugs.sha256

          cp GeneralUser-GS.sf2 sdcard/soundfonts/
          mkdir -p sdcard/docs
          cp CHANGELOG.GeneralUserGS LICENSE.GeneralUserGS sdcard/docs/
          cp LICENSE sdcard/docs/
          cp README.md sdcard/docs/

      - name: Retrieve built kernels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kernel-*
          path: sdcard
          merge-multiple: true

      - name: Create release package
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          # Normalise timestamps so the archive is reproducible from the commit.
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          find sdcard -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          # -X drops uid/gid and extra attributes, which differ per runner.
          (cd sdcard && zip -q -r -X "../mt32-pi-${VERSION}.zip" ./*)

      # The bare-metal kernels cannot be executed on a runner, so this is a
      # structural check rather than a smoke test: the archive must contain
      # exactly the kernels the board matrix built, each a valid 64-bit ARM
      # image of a plausible size, plus the boot firmware and the SoundFont.
      - name: Check the archive contents
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf inspect && mkdir inspect
          unzip -q "mt32-pi-${VERSION}.zip" -d inspect

          missing=0
          for f in kernel8.img kernel8-rpi4.img kernel_2712.img \
                   bootcode.bin start.elf start4.elf fixup.dat fixup4.dat \
                   config.txt mt32-pi.cfg \
                   soundfonts/GeneralUser-GS.sf2 soundfonts/GeneralUser-GS.cfg; do
            if [ ! -f "inspect/$f" ]; then
              echo "::error::missing from the archive: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          # A truncated or empty kernel would still be a file. Circle produces a
          # raw binary with no image header, so there is no magic to check;
          # what it does carry is the version string Kernel.mk stamps in from
          # `git describe`. Requiring the exact tag there proves the artefact
          # was built from the tagged commit rather than from a stale cache.
          for k in inspect/kernel8.img inspect/kernel8-rpi4.img inspect/kernel_2712.img; do
            size=$(stat -c%s "$k")
            if [ "$size" -lt 500000 ] || [ "$size" -gt 33554432 ]; then
              echo "::error::$k is $size bytes, which is outside the plausible range"
              exit 1
            fi
            if ! strings -a "$k" | grep -qxF "mt32-pi ${GITHUB_REF_NAME}"; then
              echo "::error::$k does not carry the version string 'mt32-pi ${GITHUB_REF_NAME}'"
              echo "found instead: $(strings -a "$k" | grep -m1 -E '^mt32-pi v' || echo none)"
              exit 1
            fi
            echo "ok  $k  $size bytes, stamped ${GITHUB_REF_NAME}"
          done

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: mt32-pi-${{ needs.identity.outputs.version }}.zip.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the payload
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          # Only the payload gets a bundle of its own. The SBOM is covered by
          # SHA256SUMS and by the attestation.
          cosign sign-blob --yes \
            --bundle "mt32-pi-${VERSION}.zip.sigstore.json" \
            "mt32-pi-${VERSION}.zip"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mt32-pi-${{ needs.identity.outputs.version }}.zip

      # The expected asset set is derived from the payload list, not maintained
      # as a second constant that can drift away from it.
      - name: Assemble and check the release candidate
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          payloads=("mt32-pi-${VERSION}.zip")
          expected=()
          for payload in "${payloads[@]}"; do
            expected+=("$payload" "${payload}.spdx.json" "${payload}.sigstore.json")
          done

          for f in "${expected[@]}"; do
            [ -s "$f" ] || { echo "::error::candidate asset missing or empty: $f"; exit 1; }
          done

          sha256sum "${expected[@]}" > SHA256SUMS
          lines=$(wc -l < SHA256SUMS)
          if [ "$lines" -ne "${#expected[@]}" ]; then
            echo "::error::SHA256SUMS has $lines lines for ${#expected[@]} assets"
            exit 1
          fi
          cat SHA256SUMS

      - name: Verify the signature before anything is published
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "mt32-pi-${VERSION}.zip.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "mt32-pi-${VERSION}.zip"
          echo "::notice::cosign verified the payload against this repository's workflow identity"

      - name: Keep the package as a run artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mt32-pi-${{ needs.identity.outputs.version }}
          path: |
            mt32-pi-*.zip
            mt32-pi-*.spdx.json
            mt32-pi-*.sigstore.json
            SHA256SUMS

      # gh release upload rather than a release action: release-please already
      # created the draft and wrote its notes from the changelog. An action that
      # regenerates the body would overwrite them.
      - name: Attach the assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          # A test tag has no release-please draft. Create it here rather than
          # letting gh release upload create a published release as a side
          # effect. A production tag always has one and this is a no-op.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in
              *-*) ;;
              *) echo "::error::no release exists for the production tag $TAG"; exit 1 ;;
            esac
            gh release create "$TAG" --draft --prerelease --title "$TAG" \
              --notes "Test build for pipeline qualification. Not a release."
            echo "::notice::created a draft prerelease for the test tag $TAG"
          fi

          gh release upload "$TAG" \
            "mt32-pi-${VERSION}.zip" \
            "mt32-pi-${VERSION}.zip.spdx.json" \
            "mt32-pi-${VERSION}.zip.sigstore.json" \
            SHA256SUMS --clobber

      # Verify before anything becomes public: download what the release now
      # serves and compare it byte for byte with what was built here.
      - name: Verify the attached assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir readback
          gh release download "$TAG" --dir readback --clobber
          cd readback
          sha256sum --check SHA256SUMS
          cmp "../SHA256SUMS" SHA256SUMS
          echo "::notice::the attached assets match the build byte for byte"

      # A tag carrying a prerelease suffix produces a prerelease that never
      # becomes "Latest". Only a production tag is promoted.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          if [ "$prerelease" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            echo "::notice::$TAG published as a prerelease and not promoted to latest"
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
            echo "::notice::$TAG published and promoted to latest"
          fi

          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "$prerelease"

      # And once more against the public download, without a token in the
      # request, because that is the path a user actually takes.
      - name: Verify the public download
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir public
          curl -sSfL -o "public/mt32-pi-${VERSION}.zip" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mt32-pi-${VERSION}.zip"
          cmp "mt32-pi-${VERSION}.zip" "public/mt32-pi-${VERSION}.zip"
          echo "::notice::the public download matches the build byte for byte"
