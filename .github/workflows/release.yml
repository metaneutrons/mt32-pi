name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  toolchain-version: 14.3.rel1
  boot-home: external/circle-stdlib/libs/circle/boot
  wlan-home: external/circle-stdlib/libs/circle/addon/wlan

jobs:
  build:
    runs-on: ubuntu-latest
    name: build-${{ matrix.board }}
    strategy:
      fail-fast: false
      matrix:
        board: [pi3-64, pi4-64, pi5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch submodules
        run: make submodules

      - name: Cache ARM toolchains
        id: cache-toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
          key: cache-arm-toolchains-${{ env.toolchain-version }}

      - name: Install toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          for triplet in arm-none-eabi aarch64-none-elf; do
            wget -q https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.toolchain-version }}/binrel/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
            tar -xf arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz -C ~
            rm arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
          done

      - name: Update PATH
        run: |
          for triplet in arm-none-eabi aarch64-none-elf; do
            echo "$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> "$GITHUB_PATH"
          done

      - name: Build
        run: make -j BOARD=${{ matrix.board }}

      - name: Upload kernel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-${{ matrix.board }}
          path: kernel*.img

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release is the only write this workflow needs.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch submodules
        run: make submodules

      - name: Cache ARM toolchains
        id: cache-toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
            ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
          key: cache-arm-toolchains-${{ env.toolchain-version }}

      - name: Update PATH
        run: |
          for triplet in arm-none-eabi aarch64-none-elf; do
            echo "$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> "$GITHUB_PATH"
          done

      - name: Download boot firmware
        run: |
          make -C ${{ env.boot-home }} firmware armstub64
          cp ${{ env.boot-home }}/armstub8-rpi4.bin \
             ${{ env.boot-home }}/bcm2711-rpi-4-b.dtb \
             ${{ env.boot-home }}/bcm2711-rpi-400.dtb \
             ${{ env.boot-home }}/bcm2711-rpi-cm4.dtb \
             ${{ env.boot-home }}/bootcode.bin \
             ${{ env.boot-home }}/COPYING.linux \
             ${{ env.boot-home }}/fixup_cd.dat \
             ${{ env.boot-home }}/fixup4cd.dat \
             ${{ env.boot-home }}/LICENCE.broadcom \
             ${{ env.boot-home }}/start_cd.elf \
             ${{ env.boot-home }}/start4cd.elf \
             sdcard

      - name: Download WLAN firmware
        run: |
          mkdir -p sdcard/firmware
          make -C ${{ env.wlan-home }}/firmware
          cp ${{ env.wlan-home }}/firmware/*.bin \
             ${{ env.wlan-home }}/firmware/*.txt \
             ${{ env.wlan-home }}/firmware/*.clm_blob \
             sdcard/firmware/
          wget -q -O sdcard/firmware/LICENCE.broadcom_bcm43xx \
               https://raw.githubusercontent.com/RPi-Distro/firmware-nonfree/master/debian/config/brcm80211/LICENSE

      # Pinned to a commit and checked against recorded hashes. The previous
      # source was an unpinned Google Drive link fetched with gdown, so whatever
      # sat behind that link went into the release unverified.
      - name: Download the GeneralUser GS SoundFont
        env:
          # GeneralUser GS 2.0.3, documentation revision 6.
          GUGS_COMMIT: 684543d5e5efaef08d02be50dcda8d552478fa60
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/${GUGS_COMMIT}"
          curl -sSfL -o GeneralUser-GS.sf2      "${base}/GeneralUser-GS.sf2"
          curl -sSfL -o CHANGELOG.GeneralUserGS "${base}/documentation/CHANGELOG.md"
          curl -sSfL -o LICENSE.GeneralUserGS   "${base}/documentation/LICENSE.txt"

          printf '%s  %s\n' \
            9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe GeneralUser-GS.sf2 \
            2ed3138c31d43c8a36e106703679e3ec88bf579da7c34051bd9531ec08939b44 CHANGELOG.GeneralUserGS \
            7b32efefdf95ce38a043799f0659853ddc00fbaa14d8c50f0aca16b9b8b405be LICENSE.GeneralUserGS \
            > gugs.sha256
          sha256sum --check --strict gugs.sha256

          cp GeneralUser-GS.sf2 sdcard/soundfonts/
          mkdir -p sdcard/docs
          cp CHANGELOG.GeneralUserGS LICENSE.GeneralUserGS sdcard/docs/
          cp LICENSE sdcard/docs/
          cp README.md sdcard/docs/

      - name: Retrieve built kernels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kernel-*
          path: sdcard
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create release package
        run: cd sdcard && zip -r "../mt32-pi-${{ steps.version.outputs.version }}.zip" ./*

      - name: Upload SD card archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mt32-pi-${{ steps.version.outputs.version }}
          path: mt32-pi-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: mt32-pi-*.zip
          generate_release_notes: true
