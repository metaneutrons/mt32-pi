# Reverb and chorus values recommended by the author of GeneralUser GS for
# version 2.x. See documentation/README.md in mrbumpy409/GeneralUser-GS.
#
# gain deliberately stays at FluidSynth's default of 0.2. The author's own
# figures differ per host (1.0 for a DAW plugin, 0.5 for the FluidSynth CLI),
# none of which is mt32-pi's audio path, and raising it here would change the
# output level for every existing setup.
gain = 0.2

reverb = on
reverb_damping = 0.3
reverb_level = 0.7
reverb_room_size = 0.5
reverb_width = 0.8

chorus = on
chorus_depth = 3.6
chorus_level = 0.55
chorus_voices = 4
chorus_speed = 0.36
